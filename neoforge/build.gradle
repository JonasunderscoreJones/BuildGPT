plugins {
    id 'net.neoforged.gradle.userdev' version "${neoforge_gradle_version}"
    id 'maven-publish'
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {

    implementation "net.neoforged:neoforge:${neoforge_version}"

    implementation project(":common")
}